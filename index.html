<style>
/* Layout: una columna de teléfono. Cabecera simple, contenido por pestañas, barra inferior con cuatro pestañas. Mismo sistema visual que Plata al Día. */
:root{
  color-scheme:light;
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#17211C; --mute:#66726B; --line:#E0E5DE; --soft:#E9EDE6;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --in:#13805A; --in-soft:#DDF1E8; --out:#CC4631; --out-soft:#FAE5E0; --warn:#B7791F;
  --c0:#1D4ED8; --c1:#0E8F7A; --c2:#D9822B; --c3:#B83280; --c4:#6D5BD0; --c5:#4C9A2A; --c6:#C2410C; --c7:#0891B2; --c8:#8B6F47; --c9:#64748B;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#171F1B; --ink:#E9EFEA; --mute:#93A09A; --line:#26312B; --soft:#202A25;
    --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2742;
    --in:#4CC796; --in-soft:#17332A; --out:#F07A66; --out-soft:#3A201B; --warn:#E0A94A;
    --c0:#7C9BFF; --c1:#3FC5AE; --c2:#EDA458; --c3:#E577B8; --c4:#A597F0; --c5:#8FD05E; --c6:#F08A57; --c7:#4FC8E0; --c8:#C4A57A; --c9:#94A3B8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#171F1B; --ink:#E9EFEA; --mute:#93A09A; --line:#26312B; --soft:#202A25;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --in:#4CC796; --in-soft:#17332A; --out:#F07A66; --out-soft:#3A201B; --warn:#E0A94A;
  --c0:#7C9BFF; --c1:#3FC5AE; --c2:#EDA458; --c3:#E577B8; --c4:#A597F0; --c5:#8FD05E; --c6:#F08A57; --c7:#4FC8E0; --c8:#C4A57A; --c9:#94A3B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:112px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display);letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 10px}
header.top .hl{min-width:0;display:flex;flex-direction:column;gap:2px}
header.top h1{margin:0;font:700 22px/1.1 var(--f-display);text-wrap:balance}
header.top small{color:var(--mute);font-size:13px;font-weight:600;display:block}
header.top small::first-letter{text-transform:uppercase}
header.top .btn{flex:none}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute);background:var(--soft)}
.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 10px;font:700 13px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
h3.t{margin:0;font:700 20px/1.2 var(--f-display);text-wrap:balance}
section{margin-top:22px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.hero{padding:20px 18px 18px}
.hero .lbl{color:var(--mute);font-size:13px;font-weight:600}
.hero .big{font-size:42px;line-height:1.1;font-weight:700;margin-top:2px}
.hero .big small{font-size:18px;color:var(--mute);font-weight:500;margin-left:6px}
.split{display:flex;gap:10px;margin-top:16px}
.split>div{flex:1;border-radius:12px;padding:10px 12px;min-width:0}
.split .neu{background:var(--soft)}
.split small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.split b{font-size:19px;font-weight:700}
.split em{display:block;font-style:normal;font-size:11.5px;line-height:1.3;margin-top:3px;color:var(--mute)}
.hint{margin:14px 0 0;color:var(--mute);font-size:14px}
.pos{color:var(--in)} .neg{color:var(--out)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i.warn{background:var(--warn)}
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font:700 15px var(--f-display);color:#fff;background:var(--c9);overflow:hidden}
.dot img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
:root[data-theme="dark"] .dot{color:#0B1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot{color:#0B1020}}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:15px;font-weight:700;white-space:nowrap;color:var(--mute)}
.tx .a.pos{color:var(--in)} .tx .a.neg{color:var(--out)}
.gh{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:14px 0 2px}
.gh:first-child{padding-top:6px}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;min-height:44px;min-width:0}
textarea.field{min-height:110px;resize:vertical}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi small{color:var(--mute);font-weight:600;font-size:12.5px;display:block}
.kpi b{font-size:20px;display:block;margin-top:2px}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--mute)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{font:500 10.5px var(--f-body);fill:var(--mute)}
svg .grid{stroke:var(--line);stroke-width:1}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.key span{display:flex;gap:6px;align-items:center}
.key i{width:10px;height:10px;border-radius:3px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

function searchFoods(q){
  var toks=nrm(q).split(/\s+/).filter(Boolean);if(!toks.length)return[];
  function has(h,tk){if(h.indexOf(tk)>-1)return true;return tk.length>3&&tk.slice(-1)==="s"&&h.indexOf(tk.slice(0,-1))>-1}
  var out=foodList().filter(function(f){return toks.every(function(tk){return has(f.n,tk)})});
  function rank(f){var nm=f.nn||nrm(f.name),p=nm.indexOf(toks[0]);if(p<0&&toks[0].length>3)p=nm.indexOf(toks[0].slice(0,-1));if(p<0)return 99;if(p===0)return nm.charAt(toks[0].length)===","?0:0.5;return 1+p/100}
  out.sort(function(a,b){return rank(a)-rank(b)||(a.i!=null&&b.i!=null?a.i-b.i:a.name.length-b.name.length)});
  return out.slice(0,30).map(asItem);
}
var STOP={de:1,con:1,la:1,el:1,y:1,al:1,a:1,en:1,sin:1,los:1,las:1,del:1,o:1,un:1,una:1};
function dbMatch(name){
  var L=foodList(),q=nrm(name).replace(/[(),./%]/g," ");
  for(var i=0;i<L.length;i++)if((L[i].nn||nrm(L[i].name))===nrm(name))return L[i];
  var T=q.split(/\s+/).filter(function(x){return x&&!STOP[x]});if(!T.length)return null;
  var best=null,bs=0;
  L.forEach(function(f){
    var h=f.n,hit=0;T.forEach(function(tk){if(h.indexOf(tk)>-1||(tk.length>3&&h.indexOf(tk.replace(/(es|s)$/,""))>-1))hit++});
    var s=hit/T.length-f.name.length/2000;if(s>bs){bs=s;best=f}
  });
  return bs>=0.74?best:null;
}

function normalize(p,code){
  var n=p.nutriments||{};
  var k100=num(n["energy-kcal_100g"]);
  if(k100==null&&num(n["energy_100g"])!=null)k100=num(n["energy_100g"])/4.184;
  var kS=num(n["energy-kcal_serving"]),sq=num(p.serving_quantity),basis=null,kcal=null,serving="";
  if(kS==null&&k100!=null&&sq>0)kS=k100*sq/100;
  if(kS!=null){kcal=kS;basis="serving";serving=p.serving_size||(sq?fmtS(sq)+" g":"1 porción")}
  else if(k100!=null){kcal=k100;basis="100g";serving="100 g"}
  function mac(key){var s=num(n[key+"_serving"]),h=num(n[key+"_100g"]);
    if(basis==="serving"){if(s!=null)return Math.round(s*10)/10;if(h!=null&&sq>0)return Math.round(h*sq)/100;return null}
    return h!=null?Math.round(h*10)/10:null}
  return{p:mac("proteins"),c:mac("carbohydrates"),f:mac("fat"),code:p.code||code||"",name:(p.product_name_es||p.product_name||p.generic_name||"Producto sin nombre").trim(),
    brand:String(p.brands||"").split(",")[0].trim(),img:p.image_front_small_url||"",
    kcal:kcal==null?null:Math.round(kcal*10)/10,k100:k100==null?null:Math.round(k100*10)/10,serving:serving,basis:basis};
}

function searchProducts(q){
  var base=OFF+"/cgi/search.pl?action=process&json=1&search_simple=1&page_size=24&fields="+FIELDS+"&search_terms="+encodeURIComponent(q);
  function conv(j){return(j.products||[]).map(function(p){return normalize(p)}).filter(function(x){return x.kcal!=null})}
  return getJSON(base+"&tagtype_0=countries&tag_contains_0=contains&tag_0=argentina").then(conv).then(function(ar){
    if(ar.length>=4)return ar;
    return getJSON(base).then(conv).then(function(all){
      var seen={};ar.forEach(function(x){seen[x.code]=1});
      return ar.concat(all.filter(function(x){return!seen[x.code]}));
    });
  });
}
function productByCode(code){
  var tries=[code];
  if(code.length===12)tries.push("0"+code);
  if(code.length===13&&code.charAt(0)==="0")tries.push(code.slice(1));
  function go(k){
    if(k>=tries.length)return Promise.resolve(null);
    return fetch(OFF+"/api/v2/product/"+encodeURIComponent(tries[k])+".json?fields="+FIELDS).then(function(r){
      return r.json().catch(function(){return{status:0}});
    }).then(function(j){return j&&j.status===1&&j.product?normalize(j.product,tries[k]):go(k+1)});
  }
  return go(0);
}

var ACTS=[["1.2","Sedentario (casi sin ejercicio)"],["1.375","Ligero (1 a 3 días por semana)"],["1.55","Moderado (3 a 5 días por semana)"],["1.725","Intenso (6 a 7 días por semana)"]];
function planCalc(){
  var p=S.plan,last=S.weights[S.weights.length-1],w=num(p.start)||(last&&last.kg)||null,gw=S.target,age=num(p.age),h=num(p.height),obj=p.obj||"";
  if(!p.sex||!age||!h||!w)return{need:true};
  if(age<18||age>90||h<120||h>230||w<30||w>350||(gw&&(gw<30||gw>350)))return{bad:"Revisá los datos: edad (18 a 90), altura (120 a 230 cm) y pesos (30 a 350 kg)."};
  var d0=new Date();d0.setHours(0,0,0,0);var days=0;if(p.date){days=Math.round((new Date(p.date+"T00:00:00")-d0)/864e5)}
  var bmr=10*w+6.25*h-5*age+(p.sex==="m"?5:-161),tdee=bmr*parseFloat(p.act||1.375),floor=p.sex==="m"?1500:1200,warns=[];
  var dated=!!gw&&days>=7&&(obj===""||obj==="grasa"||obj==="musculo"||obj==="ambas");
  if(gw&&p.date&&days<7&&(obj===""||obj==="grasa"||obj==="musculo"||obj==="ambas"))return{bad:"Elegí una fecha objetivo a una semana o más desde hoy."};
  if(!dated&&obj==="")return{need:true};
  if(!dated){
    var f={grasa:0.8,musculo:1.1,ambas:0.95,mantener:1,otro:1}[obj],g=tdee*f;
    if(f<1&&g<floor){g=floor;warns.push("Con tu gasto estimado, el mínimo recomendable de "+fmt(floor)+" kcal ya es casi un déficit completo: conviene consultarlo con un profesional.")}
    var note={grasa:"Déficit moderado de 20 %. Si cargás un peso objetivo y una fecha, lo ajustamos a tu plazo.",musculo:"Superávit leve de +10 % para ganar músculo con poca grasa. Va de la mano de entrenamiento de fuerza y de la proteína indicada.",ambas:"Cerca del mantenimiento (−5 %) con proteína alta y entrenamiento de fuerza: recomposición lenta pero sostenida.",mantener:"Calorías de mantenimiento para sostener tu peso.",otro:"Calorías de mantenimiento como punto de partida; contale tu objetivo al asistente para afinarlo."}[obj];
    return{def:true,tdee:Math.round(tdee),goal:Math.round(g/10)*10,daily:Math.round(g-tdee),lose:f<1,warns:warns,note:note,obj:obj,w:w};
  }
  var diff=gw-w,lose=diff<0;
  if(obj==="grasa"&&diff>=0.05)warns.push("Elegiste bajar grasa, pero tu peso objetivo es mayor que el inicial.");
  if(obj==="musculo"&&diff<=-0.05)warns.push("Elegiste ganar músculo, pero tu peso objetivo es menor que el inicial.");
  if(Math.abs(diff)<0.05)return{keep:true,tdee:Math.round(tdee),goal:Math.round(tdee/10)*10,days:days,obj:obj,w:w};
  var daily=diff*7700/days,goal=tdee+daily,clamped=false,room=0;
  if(lose&&goal<floor){
    clamped=true;goal=floor;room=tdee-floor;
    if(room>0){var realDays=Math.ceil(-diff*7700/room),rd=new Date(d0);rd.setDate(rd.getDate()+realDays);warns.push("Para llegar a la fecha pedida habría que comer menos de "+fmt(floor)+" kcal por día, que no es recomendable. Con "+fmt(floor)+" kcal por día llegarías cerca del "+rd.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"})+".")}
    else warns.push("Tu gasto estimado está por debajo del mínimo recomendable ("+fmt(floor)+" kcal): conviene consultarlo con un profesional.");
  }
  var wk=Math.abs(diff)/days*7,pct=wk/w*100;
  if(!clamped&&lose&&pct>1)warns.push("El ritmo es exigente (más de 1 % del peso por semana). Conviene alargar el plazo.");
  if(!lose&&pct>0.5)warns.push("El ritmo de subida es alto: para ganar músculo con poca grasa conviene un ritmo de 0,25 a 0,5 % del peso por semana. Alargá el plazo.");
  var bmi=gw/Math.pow(h/100,2);if(bmi<18.5)warns.push("Tu peso objetivo daría un IMC de "+fmt1(bmi)+", por debajo del rango saludable.");
  var rate=clamped?(room>0?room/7700*7:0):(diff/days*7);
  return{tdee:Math.round(tdee),daily:Math.round(clamped?-(tdee-goal):daily),goal:Math.round(goal/10)*10,wk:Math.abs(rate),lose:lose,warns:warns,days:days,diff:diff,w:w,obj:obj};
}
function macroLine(kcal){var T=macroTargets(kcal);return'<p class="hint" style="margin:0">Con esa meta, tus macros orientativos por día: <b>'+fmt(T.p)+" g de proteínas</b>, "+fmt(T.c)+" g de carbohidratos y "+fmt(T.f)+" g de grasas.</p>"}
function planOut(){

  if(r.bad)return'<p class="sub" style="margin:0;color:var(--out)">'+esc(r.bad)+"</p>";
  var btn='<button class="btn small" data-a="useplan">Usar '+fmt(r.goal)+" kcal como meta diaria</button>";
  if(r.keep)return'<p class="sub" style="margin:0">Tu peso inicial y el objetivo coinciden: para mantenerlo comé unas <b>'+fmt(r.goal)+" kcal</b> por día.</p>"+macroLine(r.goal)+btn;
  var top='<div class="split"><div class="neu"><small>Mantenimiento</small><b class="num">'+fmt(r.tdee)+'</b><em>kcal/día</em></div><div class="neu"><small>'+(r.daily<0?"Déficit":r.daily>0?"Superávit":"Ajuste")+'</small><b class="num">'+(r.daily>0?"+":"")+fmt(r.daily)+'</b><em>kcal/día</em></div></div>';
  var mid=r.def?'<p class="hint" style="margin:0">'+(r.obj?"<b>"+esc(objLabel(r.obj))+"</b>: meta sugerida ":"Meta sugerida ")+"de <b>"+fmt(r.goal)+" kcal por día</b>. "+esc(r.note)+"</p>":
    '<p class="hint" style="margin:0">Para '+(r.lose?"bajar ":"subir ")+fmt1(Math.abs(r.diff))+" kg en "+r.days+" días: meta de <b>"+fmt(r.goal)+" kcal por día</b> (unos "+fmt1(r.wk)+" kg por semana).</p>";
  return top+mid+macroLine(r.goal)+r.warns.map(function(x){return'<p class="sub" style="margin:0;color:var(--warn)">'+esc(x)+"</p>"}).join("")+btn;
}

    case"useplan":{var pr=planCalc();if(pr.goal){S.goal=pr.goal;persist();render(true);toast("Meta diaria: "+fmt(pr.goal)+" kcal")}break}
    case"impgo":importRecipe();break;
    case"chatsend":{var ci=$("#chat-in");chatSend(ci?ci.value:"");break}
    case"chatstop":if(CH.ctl){CH.ctl.userStop=true;CH.ctl.abort()}break;
    case"chatretry":chatSend(null,true);break;
    case"chatchip":chatSend(CHIPS[+el.dataset.i]);break;
    case"chatclear":if(!confirmTap(el))break;CH.msgs=[];CH.err=null;saveChat();render(true);break;
    case"scan":startScan();break;
    case"mealphoto":A.photoErr=null;if(!aiOn()){toast(gemErr({nokey:true}));break}{var mp=$("#meal-photo");if(mp)mp.click()}break;
    case"prdel":readRows();A.rows.splice(+el.dataset.i,1);if(!A.rows.length){A.mode="search";drawAdd()}else drawPhoto();break;
    case"photoadd":addPhoto();break;
    case"dbnew":openFoodForm(null);break;
    case"dbedit":readDetail();openFoodForm(A.item);break;
    case"dbsave":saveFood();break;
    case"dbback":if(A.form){readFoodForm();A.mode=A.form.prev||"search";A.form=null;drawAdd()}break;
    case"dbsync":{var b=el;b.disabled=true;b.textContent="Actualizando…";loadDB(true).then(function(){b.disabled=false;b.textContent="Actualizar ahora";toast(DBSRC==="nube"?"Base actualizada desde la nube":"No se pudo leer la nube; uso "+DBSRC)});break}
    case"prsug":{readRows();var sx=A.sug&&A.sug[+el.dataset.i]&&A.sug[+el.dataset.i][+el.dataset.j],rx=A.rows[+el.dataset.i];if(sx&&rx){rx.n=sx.name;rx.k=sx.k100;rx.p=sx.p;rx.c=sx.c;rx.f=sx.f;rx.from="db";rx.ia=null;drawPhoto()}break}
    case"prai":aiRow(+el.dataset.i);break;
    case"pobj":readPlan();S.plan.obj=S.plan.obj===el.dataset.o?"":el.dataset.o;persist();render(true);break;
    case"scanphoto":{var pi=$("#scan-photo");if(pi)pi.click();break}
    case"manualcode":openDetail({custom:true,name:"",brand:"",code:(A&&A.notFoundCode)||"",kcal:"",serving:""});break;
    case"scanclose":stopScan();$("#scanlayer").innerHTML="";break;
    case"scancode":{var c=($("#scan-code").value||"").trim();if(!/^\d{8,14}$/.test(c)){toast("El código tiene entre 8 y 14 números");break}onCode(c);break}
    case"editW":openW(el.dataset.d);break;
    case"saveW":{
      readW();var n=num(W.amount);
      if(!(n>=20&&n<=400)){toast("Ingresá un peso entre 20 y 400 kg");$("#w_amt").focus();break}
      S.weights=S.weights.filter(function(w){return w.d!==W.date});S.weights.push({d:W.date,kg:Math.round(n*10)/10});
      S.weights.sort(function(x,y){return x.d<y.d?-1:1});V.tab="peso";
      persist();closeSheet();render(true);window.scrollTo(0,0);toast("Peso guardado");break}
    case"delW":
      if(!W.confirm){readW();W.confirm=true;drawW();break}
      S.weights=S.weights.filter(function(w){return w.d!==W.date});persist();closeSheet();render(true);toast("Registro eliminado");break;
    case"open":V.rec=id;render();window.scrollTo(0,0);break;
    case"back":V.rec=null;V.draft=null;render();break;
    case"edit":V.rec={edit:id};render();break;
    case"fav":{var r=S.recipes.filter(function(x){return x.id===id})[0];if(r){r.fav=!r.fav;persist();render(true)}break}
    case"delRec":if(!confirmTap(el))break;S.recipes=S.recipes.filter(function(x){return x.id!==id});V.rec=null;persist();render();toast("Receta borrada");break;
    case"saveRec":{
      var title=$("#rf-title").value.trim();if(!title){toast("Poné un nombre a la receta");break}
      var d={title:title,min:parseInt($("#rf-min").value,10)||0,tags:$("#rf-tags").value.trim(),ing:$("#rf-ing").value,steps:$("#rf-steps").value,src:($("#rf-src")||{}).value||""},rid;
      if(V.rec==="new"){rid=uid();S.recipes.unshift(Object.assign({id:rid,fav:false},d))}
      else{rid=V.rec.edit;var q=S.recipes.filter(function(x){return x.id===rid})[0];if(q){Object.assign(q,d);delete q.ejemplo}}
      V.rec=rid;V.draft=null;persist();render();window.scrollTo(0,0);toast("Receta guardada");break}
    case"tag":V.tag=V.tag===el.dataset.t?null:el.dataset.t;renderRec();break;
    case"favs":V.favs=!V.favs;renderRec();break;
    case"backup":{
      var blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),lk=document.createElement("a");
      lk.href=u;lk.download="calorias-y-peso-"+ymd(now)+".json";document.body.appendChild(lk);lk.click();setTimeout(function(){URL.revokeObjectURL(u);lk.remove()},800);break}
    case"wipe":if(!confirmTap(el))break;S=defaults();persist();V.day=ymd(now);render(true);toast("Datos borrados");break;
  }
});
document.addEventListener("focusin",function(e){if(e.target&&e.target.id==="scan-code"){scan.paused=true;scanMsg("Lectura en pausa mientras escribís el código.")}});
document.addEventListener("focusout",function(e){if(e.target&&e.target.id==="scan-code"&&!e.target.value){scan.paused=false;scanMsg("Apuntá al código de barras, de frente y con buena luz.")}});
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="rec-q"){V.q=e.target.value;renderRec()}
  if(id&&id.indexOf("p-")===0&&id!=="p-act"&&$("#plan-out")){readPlan();persist();$("#plan-out").innerHTML=planOut()}
  if(id==="d_kcal"||id==="d_serv"||id==="d_g"||id==="d_p"||id==="d_c"||id==="d_f")updateTotal();
  if(e.target.classList&&e.target.classList.contains("pr-n")&&A&&A.rows){showSug(+e.target.closest(".pr").dataset.i,e.target.value)}
  if(e.target.classList&&(e.target.classList.contains("pr-g")||e.target.classList.contains("pr-k"))&&A&&A.rows)photoTotal();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    if(e.target.id==="a-q"){e.preventDefault();doSearch()}
    if(e.target.id==="chat-in"){e.preventDefault();var cb=document.querySelector('[data-a="chatsend"]');if(cb)cb.click()}
    if(e.target.id==="scan-code"){e.preventDefault();var b=document.querySelector('[data-a="scancode"]');if(b)b.click()}
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="w_date"&&W){readW();var ex=S.weights.filter(function(x){return x.d===W.date})[0];if(ex)W.amount=String(ex.kg).replace(".",",");W.confirm=false;drawW()}
  if(t.id==="scan-photo"&&t.files&&t.files[0]){decodePhoto(t.files[0]);t.value=""}
  if(t.id==="meal-photo"&&t.files&&t.files[0]&&A){var pf=t.files[0];t.value="";analyzePhoto(pf)}
  if(t.id==="p-act"||t.id==="p-date"){readPlan();persist();var po=$("#plan-out");if(po)po.innerHTML=planOut()}
  if(t.id==="s-goal"){var g=parseInt(String(t.value).replace(/\./g,""),10);if(g>=500&&g<=10000){S.goal=g;persist();toast("Meta actualizada")}else{t.value=S.goal;toast("Ingresá una meta entre 500 y 10.000 kcal")}}
  if(t.id==="s-target"){var v=num(t.value);S.target=v!=null&&v>=20&&v<=400?Math.round(v*10)/10:null;persist();toast(S.target?"Objetivo guardado":"Objetivo quitado")}
  if(t.id==="imp"&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||typeof d!=="object"||!d.cal||!Array.isArray(d.weights))throw 0;S=merge(d);persist();V.day=ymd(now);render(true);toast("Copia restaurada")}catch(x){toast("El archivo no es una copia válida")}};
    fr.readAsText(t.files[0]);
  }
});

/* ---------- arranque ---------- */
var local=loadLocal();if(local)S=merge(local);
drawNav();render();setTimeout(loadDB,300);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
